<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Students - Student Information System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-sidebar" data-page="students">

  <div id="sidebar-placeholder"></div>

  <main class="page-main">
    <h1>View Students</h1>
    <div class="card">
      <input type="text" id="search" placeholder="Search by name or course">
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Age</th><th>Course</th><th>Email</th><th>Actions</th></tr>
        </thead>
        <tbody id="studentList"></tbody>
      </table>
      <p class="message" id="message"></p>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/students.js"></script>
</body>
</html>
